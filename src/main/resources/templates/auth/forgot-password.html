<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>

    <title>Forgot Password - Spring Security Project</title>

</head>

<body>

<div layout:fragment="content">

    <div class="auth-page">

        <div class="auth-container">

            <div class="auth-card">

                <!-- Header -->

                <div class="auth-header">

                    <div class="auth-logo">
                        🔑
                    </div>

                    <h1>Forgot Password</h1>

                    <p>
                        Enter your email to receive a password reset OTP
                    </p>

                </div>

                <!-- Forgot password form -->

                <form th:action="@{/forgot-password}"
                      th:object="${forgotPasswordDTO}"
                      method="post"
                      class="auth-form">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <!-- Global errors -->

                    <div th:if="${#fields.hasGlobalErrors()}"
                         class="alert error">

                        <div th:each="e : ${#fields.globalErrors()}"
                             th:text="${e}">
                        </div>

                    </div>

                    <!-- Email -->

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input id="email"
                               type="email"
                               th:field="*{email}"
                               placeholder="Enter your email"
                               autocomplete="email"
                               required>

                        <div class="field-error"
                             th:if="${#fields.hasErrors('email')}"
                             th:errors="*{email}">
                        </div>

                    </div>

                    <!-- Submit -->

                    <button type="submit"
                            class="login-btn">
                        Send OTP
                    </button>

                </form>

                <!-- Back to Login -->

                <div class="back-home">

                    <a th:href="@{/login}">
                        ← Back to Login
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
