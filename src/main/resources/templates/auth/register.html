<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <title>Register</title>
</head>

<body>

<div layout:fragment="content">

    <div class="container">

        <div class="panel"
             style="max-width:600px;margin:30px auto;">

            <div style="text-align:center;margin-bottom:25px;">

                <div style="font-size:42px;">
                    🔐
                </div>

                <h1>Create an Account</h1>

                <p>
                    Register a new account to get started.
                </p>

            </div>

            <form th:action="@{/register}"
                  th:object="${registerDTO}"
                  method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <!-- Global errors must be inside the form -->

                <div th:if="${#fields.hasGlobalErrors()}"
                     class="alert error">

                    <div th:each="err : ${#fields.globalErrors()}"
                         th:text="${err}">
                    </div>

                </div>

                <!-- Username -->

                <div class="form-group"
                     style="margin-bottom:15px;">

                    <label for="username">
                        Username
                    </label>

                    <input type="text"
                           id="username"
                           th:field="*{username}"
                           placeholder="Enter your username"
                           autocomplete="username">

                    <div th:if="${#fields.hasErrors('username')}"
                         class="field-error"
                         th:errors="*{username}">
                    </div>

                </div>

                <!-- Email -->

                <div class="form-group"
                     style="margin-bottom:15px;">

                    <label for="email">
                        Email
                    </label>

                    <input type="email"
                           id="email"
                           th:field="*{email}"
                           placeholder="Enter your email"
                           autocomplete="email">

                    <div th:if="${#fields.hasErrors('email')}"
                         class="field-error"
                         th:errors="*{email}">
                    </div>

                </div>

                <!-- Full Name -->

                <div class="form-group"
                     style="margin-bottom:15px;">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input type="text"
                           id="fullName"
                           th:field="*{fullName}"
                           placeholder="Enter your full name"
                           autocomplete="name">

                    <div th:if="${#fields.hasErrors('fullName')}"
                         class="field-error"
                         th:errors="*{fullName}">
                    </div>

                </div>

                <!-- Password -->

                <div class="form-group"
                     style="margin-bottom:15px;">

                    <label for="password">
                        Password
                    </label>

                    <input type="password"
                           id="password"
                           th:field="*{password}"
                           placeholder="Enter your password"
                           autocomplete="new-password">

                    <div th:if="${#fields.hasErrors('password')}"
                         class="field-error"
                         th:errors="*{password}">
                    </div>

                </div>

                <!-- Confirm Password -->

                <div class="form-group"
                     style="margin-bottom:20px;">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input type="password"
                           id="confirmPassword"
                           th:field="*{confirmPassword}"
                           placeholder="Confirm your password"
                           autocomplete="new-password">

                    <div th:if="${#fields.hasErrors('confirmPassword')}"
                         class="field-error"
                         th:errors="*{confirmPassword}">
                    </div>

                </div>

                <!-- Submit -->

                <button type="submit"
                        class="btn primary"
                        style="width:100%;">
                    Register
                </button>

            </form>

            <!-- Login link -->

            <div style="text-align:center;margin-top:20px;">

                <p>
                    Already have an account?
                </p>

                <a th:href="@{/login}"
                   class="btn secondary">
                    Sign In
                </a>

            </div>

            <!-- Home -->

            <div style="text-align:center;margin-top:15px;">

                <a th:href="@{/}">
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>

</div>

</body>

</html>
