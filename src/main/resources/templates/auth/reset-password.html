<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>

    <title>Reset Password - Spring Security Project</title>

</head>

<body>

<div layout:fragment="content">

    <div class="auth-page">

        <div class="auth-container">

            <div class="auth-card">

                <!-- Header -->

                <div class="auth-header">

                    <div class="auth-logo">
                        🔑
                    </div>

                    <h1>Reset Password</h1>

                    <p>
                        Enter the OTP and create a new password
                    </p>

                </div>

                <!-- Success message -->

                <div th:if="${success}"
                     class="alert success"
                     th:text="${success}">
                </div>

                <!-- Reset password form -->

                <form th:action="@{/reset-password}"
                      th:object="${resetPasswordDTO}"
                      method="post"
                      class="auth-form">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <!-- Global errors -->

                    <div th:if="${#fields.hasGlobalErrors()}"
                         class="alert error">

                        <div th:each="e : ${#fields.globalErrors()}"
                             th:text="${e}">
                        </div>

                    </div>

                    <!-- Email -->

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input id="email"
                               type="email"
                               th:field="*{email}"
                               placeholder="Enter your email"
                               autocomplete="email"
                               required>

                        <div class="field-error"
                             th:if="${#fields.hasErrors('email')}"
                             th:errors="*{email}">
                        </div>

                    </div>

                    <!-- OTP -->

                    <div class="form-group">

                        <label for="otp">
                            Verification Code
                        </label>

                        <input id="otp"
                               type="text"
                               name="otp"
                               maxlength="6"
                               inputmode="numeric"
                               pattern="[0-9]{6}"
                               placeholder="Enter 6-digit OTP"
                               autocomplete="one-time-code"
                               required>

                    </div>

                    <!-- New Password -->

                    <div class="form-group">

                        <label for="password">
                            New Password
                        </label>

                        <input id="password"
                               type="password"
                               th:field="*{password}"
                               placeholder="Enter your new password"
                               autocomplete="new-password"
                               required>

                        <div class="field-error"
                             th:if="${#fields.hasErrors('password')}"
                             th:errors="*{password}">
                        </div>

                    </div>

                    <!-- Confirm Password -->

                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input id="confirmPassword"
                               type="password"
                               th:field="*{confirmPassword}"
                               placeholder="Confirm your new password"
                               autocomplete="new-password"
                               required>

                        <div class="field-error"
                             th:if="${#fields.hasErrors('confirmPassword')}"
                             th:errors="*{confirmPassword}">
                        </div>

                    </div>

                    <!-- Submit -->

                    <button type="submit"
                            class="login-btn">
                        Reset Password
                    </button>

                </form>

                <!-- Back to Login -->

                <div class="back-home">

                    <a th:href="@{/login}">
                        ← Back to Login
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
