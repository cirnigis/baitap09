<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>

    <title>Verify OTP - Spring Security Project</title>

</head>

<body>

<div layout:fragment="content">

    <div class="auth-page">

        <div class="auth-container">

            <div class="auth-card">

                <!-- Header -->

                <div class="auth-header">

                    <div class="auth-logo">
                        🔐
                    </div>

                    <h1>Verify OTP</h1>

                    <p>
                        Enter the verification code sent to your email
                    </p>

                </div>

                <!-- Success message -->

                <div th:if="${success}"
                     class="alert success"
                     th:text="${success}">
                </div>

                <!-- Verify OTP form -->

                <form th:action="@{/verify-otp}"
                      th:object="${verifyOtpDTO}"
                      method="post"
                      class="auth-form">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <!-- Global errors -->

                    <div th:if="${#fields.hasGlobalErrors()}"
                         class="alert error">

                        <div th:each="e : ${#fields.globalErrors()}"
                             th:text="${e}">
                        </div>

                    </div>

                    <!-- Email -->

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input id="email"
                               type="email"
                               th:field="*{email}"
                               placeholder="Enter your email"
                               autocomplete="email"
                               required>

                        <div class="field-error"
                             th:if="${#fields.hasErrors('email')}"
                             th:errors="*{email}">
                        </div>

                    </div>

                    <!-- OTP -->

                    <div class="form-group">

                        <label for="otp">
                            Verification Code
                        </label>

                        <input id="otp"
                               type="text"
                               th:field="*{otp}"
                               maxlength="6"
                               inputmode="numeric"
                               pattern="[0-9]{6}"
                               placeholder="Enter 6-digit OTP"
                               autocomplete="one-time-code"
                               required>

                        <div class="field-error"
                             th:if="${#fields.hasErrors('otp')}"
                             th:errors="*{otp}">
                        </div>

                    </div>

                    <!-- Verify -->

                    <button type="submit"
                            class="login-btn">
                        Verify OTP
                    </button>

                </form>

                <!-- Resend OTP -->

                <form th:action="@{/resend-register-otp}"
                      method="post"
                      style="margin-top: 15px;">

                    <input type="hidden"
                           name="email"
                           th:value="${verifyOtpDTO.email}">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <button type="submit"
                            class="register-btn"
                            style="width:100%;">
                        Resend OTP
                    </button>

                </form>

                <!-- Back to Login -->

                <div class="back-home">

                    <a th:href="@{/login}">
                        ← Back to Login
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
