<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

<header th:fragment="header"
        style="background:#172033; color:white;">

    <div style="
        max-width:1200px;
        margin:0 auto;
        padding:15px 20px;
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:20px;
        flex-wrap:wrap;
    ">

        <!-- Logo -->

        <a th:href="@{/}"
           style="
               color:white;
               text-decoration:none;
               font-size:22px;
               font-weight:700;
           ">
            Spring Security Project
        </a>


        <!-- Navigation -->

        <nav style="
            display:flex;
            align-items:center;
            gap:8px;
            flex-wrap:wrap;
        ">

            <a th:href="@{/}"
               class="nav-link">
                Home
            </a>

            <a th:href="@{/profile}"
               class="nav-link"
               sec:authorize="isAuthenticated()">
                My Profile
            </a>

            <a th:href="@{/products}"
               class="nav-link"
               sec:authorize="isAuthenticated()">
                Products
            </a>

            <a th:href="@{/users}"
               class="nav-link"
               sec:authorize="hasRole('ADMIN')">
                Users
            </a>

            <a th:href="@{/dashboard}"
               class="nav-link"
               sec:authorize="hasRole('ADMIN')">
                Dashboard
            </a>

        </nav>


        <!-- User information -->

        <div sec:authorize="isAuthenticated()"
             style="
                 display:flex;
                 align-items:center;
                 gap:10px;
             ">

            <!-- Avatar -->

            <div th:if="${#authentication.principal.images != null
                         and !#authentication.principal.images.isBlank()}">

                <img th:src="${#strings.substringBefore(
                                #authentication.principal.images,
                                '|'
                             )}"
                     alt="Avatar"
                     style="
                         width:40px;
                         height:40px;
                         border-radius:50%;
                         object-fit:cover;
                         border:2px solid white;
                     ">

            </div>

            <div th:unless="${#authentication.principal.images != null
                              and !#authentication.principal.images.isBlank()}"
                 style="
                     width:40px;
                     height:40px;
                     border-radius:50%;
                     background:#e2e8f0;
                     color:#172033;
                     display:flex;
                     align-items:center;
                     justify-content:center;
                     font-weight:700;
                 ">

                <span
                    th:text="${#authentication.principal.username != null
                        ? #strings.substring(
                            #authentication.principal.username,
                            0,
                            1
                          ).toUpperCase()
                        : 'U'}">
                    U
                </span>

            </div>


            <!-- User name -->

            <div>

                <div style="
                    font-weight:600;
                    line-height:1.2;
                "
                th:text="${#authentication.principal.fullName != null
                    and !#authentication.principal.fullName.isBlank()
                    ? #authentication.principal.fullName
                    : #authentication.principal.username}">
                    User
                </div>

                <div style="
                    font-size:12px;
                    opacity:.8;
                "
                th:text="${#authentication.principal.role}">
                    ROLE_USER
                </div>

            </div>


            <!-- Logout -->

            <form th:action="@{/logout}"
                  method="post"
                  style="margin-left:5px;">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <button type="submit"
                        style="
                            border:0;
                            border-radius:7px;
                            padding:7px 10px;
                            cursor:pointer;
                            font-weight:600;
                        ">
                    Logout
                </button>

            </form>

        </div>


        <!-- Login / Register -->

        <div sec:authorize="!isAuthenticated()"
             style="
                 display:flex;
                 gap:8px;
             ">

            <a th:href="@{/login}"
               class="nav-link">
                Login
            </a>

            <a th:href="@{/register}"
               class="nav-link">
                Register
            </a>

        </div>

    </div>

</header>

</body>
</html>
