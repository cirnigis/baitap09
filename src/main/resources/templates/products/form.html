<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>

    <title th:text="${mode == 'create'
        ? 'Create Product'
        : 'Edit Product'}">
        Product
    </title>

</head>

<body>

<div layout:fragment="content">

    <div class="container">

        <div class="page-title">

            <h1 th:text="${mode == 'create'
                ? 'Create Product'
                : 'Edit Product'}">
                Product
            </h1>

            <a class="btn secondary"
               th:href="@{/products}">
                Back
            </a>

        </div>

        <div class="panel">

            <form th:object="${productDTO}"
                  th:action="${mode == 'create'
                      ? '/products/create'
                      : '/products/edit/' + productDTO.id}"
                  method="post"
                  enctype="multipart/form-data">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <input type="hidden"
                       th:field="*{id}">

                <!-- Global errors -->

                <div th:if="${#fields.hasGlobalErrors()}"
                     class="alert error">

                    <div th:each="error : ${#fields.globalErrors()}"
                         th:text="${error}">
                    </div>

                </div>

                <div class="form-grid">

                    <!-- Name -->

                    <label for="name">
                        Name
                    </label>

                    <div>

                        <input id="name"
                               type="text"
                               th:field="*{name}"
                               placeholder="Enter product name">

                        <div class="field-error"
                             th:if="${#fields.hasErrors('name')}"
                             th:errors="*{name}">
                        </div>

                    </div>

                    <!-- Description -->

                    <label for="description">
                        Description
                    </label>

                    <div>

                        <textarea id="description"
                                  th:field="*{description}"
                                  rows="5"
                                  placeholder="Enter product description">
                        </textarea>

                        <div class="field-error"
                             th:if="${#fields.hasErrors('description')}"
                             th:errors="*{description}">
                        </div>

                    </div>

                    <!-- Price -->

                    <label for="price">
                        Price
                    </label>

                    <div>

                        <input id="price"
                               type="number"
                               step="0.01"
                               min="0"
                               th:field="*{price}"
                               placeholder="Enter product price">

                        <div class="field-error"
                             th:if="${#fields.hasErrors('price')}"
                             th:errors="*{price}">
                        </div>

                    </div>

                    <!-- User -->

                    <label for="userId">
                        User
                    </label>

                    <div>

                        <select id="userId"
                                th:field="*{userId}">

                            <option value="">
                                -- Select User --
                            </option>

                            <option th:each="user : ${users}"
                                    th:value="${user.id}"
                                    th:text="${user.username}">
                            </option>

                        </select>

                        <div class="field-error"
                             th:if="${#fields.hasErrors('userId')}"
                             th:errors="*{userId}">
                        </div>

                    </div>

                    <!-- Image -->

                    <label for="image">
                        Product Image
                    </label>

                    <div>

                        <input id="image"
                               type="file"
                               name="image"
                               accept="image/*">

                        <p>
                            Only image files are allowed.
                        </p>

                    </div>

                    <!-- Current image -->

                    <div th:if="${mode == 'edit'
                        and productDTO.imageUrl != null
                        and !productDTO.imageUrl.isBlank()}">

                        <label>
                            Current Image
                        </label>

                        <div>

                            <img th:src="${#strings.substringBefore(
                                productDTO.imageUrl, '|'
                            )}"
                                 alt="Current product image"
                                 class="thumb">

                        </div>

                    </div>

                    <!-- Buttons -->

                    <div></div>

                    <div>

                        <button class="btn primary"
                                type="submit">
                            Save
                        </button>

                        <a class="btn secondary"
                           th:href="@{/products}">
                            Cancel
                        </a>

                    </div>

                </div>

                <!-- Field errors -->

                <div th:if="${#fields.hasErrors('*')}"
                     class="alert error">

                    <div th:each="error : ${#fields.allErrors()}"
                         th:text="${error}">
                    </div>

                </div>

            </form>

        </div>

    </div>

</div>

</body>

</html>
