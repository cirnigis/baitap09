<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>

    <title>Product Management</title>

</head>

<body>

<div layout:fragment="content">

    <div class="container">

        <!-- Page title -->

        <div class="page-title">

            <h1>Product Management</h1>

            <div>

                <a class="btn secondary"
                   th:href="@{/}">
                    Back
                </a>

                <a class="btn primary"
                   th:href="@{/products/create}">
                    + Create Product
                </a>

            </div>

        </div>

        <!-- Messages -->

        <div th:if="${success}"
             class="alert success"
             th:text="${success}">
            Product operation completed successfully.
        </div>

        <div th:if="${error}"
             class="alert error"
             th:text="${error}">
            An error occurred.
        </div>

        <!-- Search -->

        <div class="panel">

            <form class="search"
                  th:action="@{/products}"
                  method="get">

                <input type="text"
                       name="keyword"
                       th:value="${keyword}"
                       placeholder="Search by name or description">

                <input type="hidden"
                       name="size"
                       th:value="${size}">

                <button class="btn primary"
                        type="submit">
                    Search
                </button>

            </form>

        </div>

        <!-- Product table -->

        <div class="panel">

            <div class="table-wrap">

                <table>

                    <thead>

                    <tr>

                        <th>ID</th>
                        <th>Image</th>
                        <th>Name</th>
                        <th>Price</th>
                        <th>User</th>
                        <th>Actions</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="p : ${products.content}">

                        <td th:text="${p.id}">
                            1
                        </td>

                        <td>

                            <img th:if="${p.imageUrl != null
                                and !p.imageUrl.isBlank()}"
                                 th:src="${#strings.substringBefore(p.imageUrl, '|')}"
                                 class="thumb"
                                 alt="Product image">

                            <span th:unless="${p.imageUrl != null
                                and !p.imageUrl.isBlank()}">
                                No image
                            </span>

                        </td>

                        <td th:text="${p.name}">
                            Product Name
                        </td>

                        <td th:text="${#numbers.formatDecimal(
                            p.price,
                            0,
                            'COMMA',
                            2,
                            'POINT'
                        )}">
                            0.00
                        </td>

                        <td th:text="${p.username}">
                            username
                        </td>

                        <td>

                            <div class="actions">

                                <a class="btn secondary small"
                                   th:href="@{/products/edit/{id}(id=${p.id})}">
                                    Edit
                                </a>

                                <form class="delete-form"
                                      th:action="@{/products/delete/{id}(id=${p.id})}"
                                      method="post"
                                      onsubmit="return confirm('Are you sure you want to delete this product?');">

                                    <input type="hidden"
                                           th:name="${_csrf.parameterName}"
                                           th:value="${_csrf.token}">

                                    <button class="btn danger small"
                                            type="submit">
                                        Delete
                                    </button>

                                </form>

                            </div>

                        </td>

                    </tr>

                    <tr th:if="${products.empty}">

                        <td colspan="6">
                            No products found.
                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

        <!-- Pagination -->

        <div class="pagination"
             th:if="${products.totalPages > 0}">

            <a class="btn secondary small"
               th:if="${products.hasPrevious()}"
               th:href="@{/products(
                   page=${products.number - 1},
                   size=${size},
                   keyword=${keyword}
               )}">
                &laquo;
            </a>

            <span th:each="i : ${#numbers.sequence(
                0,
                products.totalPages - 1
            )}">

                <a class="btn small"
                   th:href="@{/products(
                       page=${i},
                       size=${size},
                       keyword=${keyword}
                   )}"
                   th:text="${i + 1}"
                   th:classappend="${i == products.number
                       ? ' primary'
                       : ' secondary'}">
                    1
                </a>

            </span>

            <a class="btn secondary small"
               th:if="${products.hasNext()}"
               th:href="@{/products(
                   page=${products.number + 1},
                   size=${size},
                   keyword=${keyword}
               )}">
                &raquo;
            </a>

        </div>

    </div>

</div>

</body>

</html>
