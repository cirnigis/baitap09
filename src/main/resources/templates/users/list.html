<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>

    <title>User Management</title>

</head>

<body>

<div layout:fragment="content">

    <div class="container">

        <!-- Page title -->

        <div class="page-title">

            <h1>User Management</h1>

            <div>

                <a class="btn secondary"
                   th:href="@{/}">
                    Back
                </a>

                <a class="btn primary"
                   th:href="@{/users/create}">
                    + Create User
                </a>

            </div>

        </div>

        <!-- Messages -->

        <div th:if="${success}"
             class="alert success"
             th:text="${success}">
            User operation completed successfully.
        </div>

        <div th:if="${error}"
             class="alert error"
             th:text="${error}">
            An error occurred.
        </div>

        <!-- Search -->

        <div class="panel">

            <form class="search"
                  th:action="@{/users}"
                  method="get">

                <input type="text"
                       name="keyword"
                       th:value="${keyword}"
                       placeholder="Search by email or full name">

                <select name="size">

                    <option value="5"
                            th:selected="${size == 5}">
                        5
                    </option>

                    <option value="10"
                            th:selected="${size == 10}">
                        10
                    </option>

                    <option value="20"
                            th:selected="${size == 20}">
                        20
                    </option>

                </select>

                <button type="submit"
                        class="btn primary">
                    Search
                </button>

            </form>

        </div>

        <!-- User table -->

        <div class="panel">

            <div class="table-wrap">

                <table>

                    <thead>

                    <tr>

                        <th style="width: 5%;">
                            ID
                        </th>

                        <th style="width: 12%;">
                            Username
                        </th>

                        <th style="width: 20%;">
                            Email
                        </th>

                        <th style="width: 17%;">
                            Full Name
                        </th>

                        <th style="width: 14%;">
                            Role
                        </th>

                        <th style="width: 10%;">
                            Enabled
                        </th>

                        <th style="width: 8%;">
                            Products
                        </th>

                        <th style="width: 14%;">
                            Actions
                        </th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="user : ${users.content}">

                        <td th:text="${user.id}">
                            1
                        </td>

                        <td th:text="${user.username}">
                            username
                        </td>

                        <td th:text="${user.email}">
                            email@example.com
                        </td>

                        <td th:text="${user.fullName}">
                            Full Name
                        </td>

                        <td th:text="${user.roleName}">
                            ROLE_USER
                        </td>

                        <td th:text="${user.enabled ? 'Yes' : 'No'}">
                            Yes
                        </td>

                        <td th:text="${user.productCount}">
                            0
                        </td>

                        <td>

                            <div class="actions">

                                <a class="btn secondary small"
                                   th:href="@{/users/edit/{id}(id=${user.id})}">
                                    Edit
                                </a>

                                <form class="delete-form"
                                      th:action="@{/users/delete/{id}(id=${user.id})}"
                                      method="post"
                                      onsubmit="return confirm('Are you sure you want to delete this user?');">

                                    <input type="hidden"
                                           th:name="${_csrf.parameterName}"
                                           th:value="${_csrf.token}">

                                    <button type="submit"
                                            class="btn danger small">
                                        Delete
                                    </button>

                                </form>

                            </div>

                        </td>

                    </tr>

                    <tr th:if="${users.empty}">

                        <td colspan="8">
                            No users found.
                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

        <!-- Pagination -->

        <div class="pagination"
             th:if="${users.totalPages > 0}">

            <a class="btn secondary small"
               th:if="${users.hasPrevious()}"
               th:href="@{/users(
                   page=${users.number - 1},
                   size=${size},
                   keyword=${keyword}
               )}">
                &laquo;
            </a>

            <span th:each="i : ${#numbers.sequence(
                0,
                users.totalPages - 1
            )}">

                <a class="btn small"
                   th:href="@{/users(
                       page=${i},
                       size=${size},
                       keyword=${keyword}
                   )}"
                   th:text="${i + 1}"
                   th:classappend="${i == users.number
                       ? ' primary'
                       : ' secondary'}">
                    1
                </a>

            </span>

            <a class="btn secondary small"
               th:if="${users.hasNext()}"
               th:href="@{/users(
                   page=${users.number + 1},
                   size=${size},
                   keyword=${keyword}
               )}">
                &raquo;
            </a>

        </div>

    </div>

</div>

</body>

</html>
